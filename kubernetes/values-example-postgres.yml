# Nasazeni vzoroveho webu S DATABAZI (example-db.web + PostgreSQL) do Kubernetes.
#
#   chart:   oci://registry.nixys.ru/nuc/nxs-universal-chart, verze 3.2.2
#   release: pwe-generic  ->  https://pwe-generic.<domena>
#   image:   ghcr.io/kukam/pwe-example-postgres - hotovy image vzoroveho webu: knihovny a ovladac databaze
#            (zavislostni image pwe-postgres), engine (/PWE/PWE) a web (/PWE/webapps/example-db.web); pro
#            toto nasazeni se zadny image nestavi
#   postup:  kubernetes/README.md  (make k8s-deploy K8S=example-postgres)
#
# Web: jeden pod = dva kontejnery, nginx (port 80) a engine (FastCGI na 127.0.0.1:7779, tedy jen uvnitr
# podu). Statiku - static/ a assets/ webu a assets/ enginu - zkopiruje pri startu initContainer z image
# do sdileneho svazku a nginx ji posila primo, stejne jako ve vyvojovem stacku
# (docker-compose/docker-compose_nginx.conf).
# Databaze: PostgreSQL jako StatefulSet s vlastnim svazkem (PVC), dostupna jen uvnitr clusteru na
# <release>-postgres:5432. Schema si pri prvnim startu zalozi engine sam (migrace conf/postgres.dbversion).
#
# Hesla databaze v tomto souboru NEJSOU: jsou v kubernetes/secrets-example-postgres.yml (neni v gitu). Pri prvnim
# make k8s-deploy K8S=example-postgres ho PWE/tools/k8s.sh zalozi ze secrets-example-postgres.example.yml s nahodnymi hesly.
#
# Vlastni web s PostgreSQL: zkopiruj tento soubor jako values-<nazev>.yml (a secrets-example-postgres.example.yml jako
# secrets-<nazev>.example.yml), uprav generic.pweWeb a generic.pweImage (a pripadne generic.pweHost),
# nastav K8S_REGISTRY, sestav image webu (make k8s-image K8S=<nazev>; webapps/<web>/Dockerfile z korene
# repozitare: zavislostni image pwe-postgres + engine z pracovni kopie + web) a nasad ho
# (make k8s-deploy K8S=<nazev>, release pwe-<nazev>).
# Databaze je zde natvrdo PostgreSQL (blok statefulSets); pro PostgreSQL nebo MySQL je potreba blok
# statefulSets prepsat - viz kubernetes/README.md, Jina databaze nez PostgreSQL.

generic:
  # --- nastaveni PWE: cte je i PWE/tools/k8s.sh a pouzivaji je sablony niz ({{ .Values.generic.pwe... }}) ---
  pweWeb: example-db.web           # adresar webu: v image /PWE/webapps/<web>, u vlastniho webu i webapps/<web>
  pweProfile: postgres              # profil webu = ovladac databaze (image webu se stavi nad pwe-<profil>);
                                   # musi odpovidat databazi niz
  # Nazev image (bez registru a tagu) urcuje druh nasazeni:
  #   pwe-example-<profil>  hotovy image vzoroveho webu - nic se nestavi (make k8s-image neni potreba):
  #                 pwe-example-static (web example.web, profil static) nebo pwe-example-postgres,
  #                 pwe-example-mysql, pwe-example-postgres (web example-db.web, profil podle nazvu);
  #                 pweWeb a pweProfile musi nazvu image odpovidat
  #   jiny nazev    image vlastniho webu - stavi a nahrava ho make k8s-image z webapps/<web>/Dockerfile.
  #                 Vyhrazene nazvy (image webu se tak jmenovat nesmi): pwe-base, pwe-postgres, pwe-mysql,
  #                 pwe-postgres, pwe-debugger (zavislostni image - jen knihovny, nasadit je nejde),
  #                 pwe-example-* a zrusene pwe a pwe-static.
  pweImage: pwe-example-postgres
  pweHost: ""                      # cela adresa webu, napr. www.mujweb.cz; prazdne = <release>.<pweDomain>
  # --- nasledujici ctyri hodnoty prepisuje make k8s-deploy (--set-string) podle kubernetes/local.env;
  #     registr a tag maji u vzoroveho nasazeni vychozi hodnotu i bez nej (registr image PWE a verze
  #     enginu z PWE/VERSION) ---
  pweRegistry: ghcr.io/kukam       # registr, ze ktereho image taha cluster          (K8S_PULL_REGISTRY, K8S_REGISTRY)
  pweImageTag: latest              # tag image, pripadne tag@sha256:<digest>; make k8s-deploy predava tag
                                   # verze enginu vcetne digestu                     (K8S_IMAGE_TAG)
  pweDomain: example.com           # web pobezi na https://<release>.<pweDomain>     (K8S_DOMAIN)
  pweIssuer: letsencrypt           # ClusterIssuer cert-manageru pro certifikat      (K8S_ISSUER)
  # --- dalsi hodnoty make k8s-deploy sam neprepisuje: zmen je tady, nebo je predej pres K8S_HELM_ARGS
  #     (napr. --set-string generic.pweNginxImage=harbor.example.com/dockerhub/library/nginx) ---
  # Predpona registru pro image tretich stran (nginx, databaze), VCETNE lomitka na konci. Prazdna = primo
  # Docker Hub. Cluster, ktery taha Docker Hub pres proxy cache, ji nastavi jednou pro vsechna nasazeni:
  # K8S_HELM_ARGS=--set-string generic.pweMirror=harbor.example.com/dockerhub/library/
  pweMirror: ""
  pweNginxImage: nginx             # image webserveru (bez tagu)
  pweNginxImageTag: stable
  pweTimezone: Europe/Prague       # casove pasmo kontejneru enginu a databaze (promenna TZ)
  pweDbImage: postgres              # image databaze (bez tagu)
  pweDbImageTag: "18"
  pweDbName: pwe                   # nazev databaze a uzivatel, pod kterym se engine pripojuje; PostgreSQL
  pweDbUser: pwe                   # je zalozi jen pri prvnim startu nad prazdnym svazkem (pozdejsi zmena nic nezmeni)
  # ConfigMapy a Secrety jako bezne zdroje releasu (vychozi chovani chartu z nich dela helm hooky,
  # ktere helm uninstall nemaze).
  hookAnnotations: {}

configMaps:
  nginx-conf:
    data:
      default.conf: |
        # HTTPS konci na ingressu, do podu jde HTTP. Engine podle promenne HTTPS voli typ session
        # cookie a schema odkazu, proto se mu puvodni schema predava z hlavicky X-Forwarded-Proto.
        map $http_x_forwarded_proto $pwe_https {
            default "";
            https   on;
        }

        server {
            listen 80;
            server_tokens off;

            # nahravane soubory: stejny limit jako pwe.cgi_maxfilesize webu (100 MB)
            client_max_body_size 100m;

            # skutecna adresa klienta z hlavicky ingressu (engine ji cte z REMOTE_ADDR)
            set_real_ip_from 0.0.0.0/0;
            real_ip_header   X-Forwarded-For;

            # kontrola zivosti samotneho nginx (sondy podu)
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            # Statika primo z disku: nejdrive static/, assets/ a uploadfile/ webu, pak assets/ enginu.
            location ~ ^/(assets|static|uploadfile)/ {
                root /srv/web;
                try_files $uri @engine_assets;
                expires 7d;
                access_log off;
            }

            location @engine_assets {
                root /srv/engine;
                expires 7d;
                access_log off;
            }

            location / {
                gzip off;
                fastcgi_pass 127.0.0.1:7779;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
                fastcgi_param HTTPS $pwe_https if_not_empty;
                # Casove pasmo pro requesty: FastCGI pri kazdem requestu nahradi prostredi enginu
                # parametry od nginx, takze promenna TZ kontejneru plati jen pri startu enginu.
                fastcgi_param TZ "{{ .Values.generic.pweTimezone }}";
                # Verze statiky pro odkazy typu site.css?v=... (sablony ji znaji jako start_time).
                # Meni se s kazdym novym image, takze prohlizec po nasazeni nacte nove soubory.
                fastcgi_param APACHE_START_TIME "{{ .Values.generic.pweImageTag | sha1sum | trunc 10 }}";
            }

            error_log  /dev/stderr warn;
            access_log /dev/stdout;
        }

deployments:
  web:
    replicas: 2
    extraSelectorLabels:
      app.kubernetes.io/component: web
    terminationGracePeriodSeconds: 20
    automountServiceAccountToken: false     # pody nepotrebuji pristup k API clusteru
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: static
        image: "{{ .Values.generic.pweRegistry }}/{{ .Values.generic.pweImage }}"
        imageTag: "{{ .Values.generic.pweImageTag }}"
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            web="/PWE/webapps/{{ .Values.generic.pweWeb }}"
            mkdir -p /srv/engine /srv/web/uploadfile
            cp -a /PWE/PWE/assets /srv/engine/
            for dir in static assets; do
                if [ -d "$web/$dir" ]; then cp -a "$web/$dir" /srv/web/; fi
            done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: static
            mountPath: /srv
    containers:
      - name: fcgi
        image: "{{ .Values.generic.pweRegistry }}/{{ .Values.generic.pweImage }}"
        imageTag: "{{ .Values.generic.pweImageTag }}"
        # Pred SIGTERM pocka 5 s: ingress mezitim vyradi pod z endpointu a rozpracovane pozadavky dobehnou.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        env:
          # FastCGI posloucha jen na loopbacku podu: nginx tehoz podu se pripojuje na 127.0.0.1:7779,
          # z jinych podu port dostupny neni - ani v clusteru, kde se pravidla NetworkPolicy neuplatni.
          # Kontejner proto port 7779 nedeklaruje (zadne ports). Adresu host:port umi engine od verze
          # 2.2.1; starsi engine s ni nenastartuje (Couldn't chmod) a potrebuje ":7779" (vsechna rozhrani).
          - name: FCGI_SOCKET_PATH
            value: "127.0.0.1:7779"
          # TZ pro start enginu (pro requesty ho predava nginx, viz fastcgi_param TZ)
          - name: TZ
            value: "{{ .Values.generic.pweTimezone }}"
          - name: PWE_CONF_pwe_development
            value: "0"
          - name: PWE_CONF_http_base_url
            value: '{{ .Values.generic.pweHost | default (printf "%s.%s" .Release.Name .Values.generic.pweDomain) }}'
          - name: PWE_CONF_log_logout
            value: "STDERR"
          - name: PWE_CONF_log_loglevel
            value: "2"
          # pripojeni k databazi (prepisuje hodnoty z conf/postgres.conf webu v image)
          - name: PWE_CONF_dbi_db1_host
            value: "{{ .Release.Name }}-postgres"
          - name: PWE_CONF_dbi_db1_database
            value: "{{ .Values.generic.pweDbName }}"
          - name: PWE_CONF_dbi_db1_login
            value: "{{ .Values.generic.pweDbUser }}"
          # engine zkousi pripojeni po 1 s; pri prvnim nasazeni databaze teprve startuje
          - name: PWE_CONF_dbi_db1_trayconnect
            value: "60"
          # Trasovani DBI vypnute: conf webu muze mit loglevel 1 (kazde SQL vcetne vazanych hodnot -
          # e-maily, hashe hesel - do log/<ovladac> ve vrstve kontejneru, bez rotace).
          - name: PWE_CONF_dbi_db1_loglevel
            value: "0"
          - name: PWE_CONF_dbi_db1_logfile
            value: /dev/null
        envsFromSecret:
          db:
            - PWE_CONF_dbi_db1_password: POSTGRES_PASSWORD
        # Sonda zkousi spojeni zevnitr kontejneru (nezavisi na sitovych pravidlech podu).
        # Socket otevre engine az po pripojeni k databazi a migracich (checkDbversion): do te doby hlida
        # jen startupProbe (az 10 min = K8S_TIMEOUT), takze liveness engine nezabije uprostred migrace.
        startupProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7779"]
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7779"]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7779"]
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        # Engine bezi jako root (jako ve vyvojovem stacku), ale bez linuxovych opravneni:
        # zapisuje jen do adresaru sveho webu.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: uploadfile
            mountPath: "/PWE/webapps/{{ .Values.generic.pweWeb }}/uploadfile"
      - name: nginx
        image: "{{ .Values.generic.pweMirror }}{{ .Values.generic.pweNginxImage }}"
        imageTag: "{{ .Values.generic.pweNginxImageTag }}"
        # Pred SIGTERM pocka 5 s: ingress mezitim vyradi pod z endpointu a rozpracovane pozadavky dobehnou.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
          - name: http
            containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        # nginx potrebuje jen navazat port 80 a prepnout pracovni procesy na uzivatele nginx
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d
          - name: static
            mountPath: /srv
            readOnly: true
          - name: uploadfile
            mountPath: /srv/web/uploadfile
            readOnly: true
    volumes:
      - name: nginx-conf          # ConfigMap <release>-nginx-conf (viz configMaps)
        type: configMap
      - name: static              # kopie statiky z image (plni ji initContainer)
        type: emptyDir
      # Nahrane soubory jsou jen v tomto podu a zaniknou s nim. Pro skutecny web je nahrad svazkem
      # sdilenym mezi pody: type: pvc + polozka v pvcs s accessModes ReadWriteMany.
      - name: uploadfile
        type: emptyDir

statefulSets:
  postgres:
    replicas: 1
    extraSelectorLabels:
      app.kubernetes.io/component: postgres
    automountServiceAccountToken: false
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: postgres
        image: "{{ .Values.generic.pweMirror }}{{ .Values.generic.pweDbImage }}"
        imageTag: "{{ .Values.generic.pweDbImageTag }}"
        ports:
          - name: postgres
            containerPort: 5432
        env:
          - name: TZ
            value: "{{ .Values.generic.pweTimezone }}"
          - name: POSTGRES_DB
            value: "{{ .Values.generic.pweDbName }}"
          - name: POSTGRES_USER
            value: "{{ .Values.generic.pweDbUser }}"
        envsFromSecret:
          db:
            - POSTGRES_PASSWORD
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql
    # Svazek databaze. Bez storageClassName se pouzije vychozi trida uloziste clusteru.
    # helm uninstall ho NEMAZE (data databaze prezivi odinstalovani i nove nasazeni).
    # volumeClaimTemplates nelze po prvnim nasazeni menit (API StatefulSetu zmenu odmitne a helm upgrade
    # selze). Zvetseni svazku: kubectl --context <kontext> -n pwe patch pvc data-<release>-postgres-0
    # (trida uloziste musi mit allowVolumeExpansion), pak kubectl ... delete sts <release>-postgres
    # --cascade=orphan a make k8s-deploy s novou velikosti. Povyseni hlavni verze pweDbImageTag
    # (napr. 11.8 -> 12) delej se zalohou; PostgreSQL mezi hlavnimi verzemi data sam neprevadi (pg_upgrade nebo dump a obnova).
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

services:
  web:
    extraSelectorLabels:
      app.kubernetes.io/component: web
    ports:
      - name: http
        port: 80
        targetPort: http

ingresses:
  web:
    ingressClassName: nginx
    annotations:
      # Stav navstevnika je v databazi (pwe.save_opt_to = db), ale nahrane soubory (uploadfile/) jsou
      # v tomto prikladu jen v podu, ktery je prijal - proto navstevnik zustava u stejneho podu.
      # Se sdilenym svazkem pro uploadfile/ (ReadWriteMany) lze tyto dve anotace vypustit.
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "pwe-pod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    certManager:
      originalIssuerName: "{{ .Values.generic.pweIssuer }}"
    hosts:
      - hostname: '{{ .Values.generic.pweHost | default (printf "%s.%s" .Release.Name .Values.generic.pweDomain) }}'
        paths:
          - path: /
            serviceName: web
            servicePort: http

# Sitova pravidla: do podu webu smi zvenku jen port 80 (nginx; ingress controller i ostatni pody),
# databaze prijima spojeni jen z podu webu. Pravidla musi podporovat sitovy plugin clusteru (Calico,
# Cilium ...); bez nej se tise ignoruji - databazi pak pred ostatnimi pody chrani jen heslo.
# Port enginu 7779 na nich nezavisi: engine posloucha jen na 127.0.0.1 (FCGI_SOCKET_PATH vyse), takze
# jiny pod nemuze obejit ingress a nginx a podvrhnout enginu adresu klienta nebo HTTPS.
# Port 80 lze dal omezit jen na namespace ingress controlleru (from: namespaceSelector).
networkPolicies:
  web:
    podSelector:
      matchLabels:
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: web
    policyTypes: ["Ingress"]
    ingress:
      - ports:
          - port: 80
            protocol: TCP
  # Databaze prijima spojeni jen z podu webu tehoz releasu.
  postgres:
    podSelector:
      matchLabels:
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: postgres
    policyTypes: ["Ingress"]
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/instance: "{{ .Release.Name }}"
                app.kubernetes.io/component: web
        ports:
          - port: 5432
            protocol: TCP
