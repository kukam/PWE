# Hesla databaze pro kubernetes/values-example-postgres.yml (Secret <release>-db).
#
# Tento soubor je vzor. Skutecna hesla patri do kubernetes/secrets-example-postgres.yml, ktery NENI v gitu:
# pri prvnim make k8s-deploy K8S=example-postgres ho PWE/tools/k8s.sh zalozi z tohoto vzoru a kazde
# CHANGE_ME nahradi nahodnym heslem. Soubor si uschovej - PostgreSQL si hesla zapise do sveho svazku
# pri prvnim startu a pozdejsi zmena tady je v databazi sama nezmeni.
secrets:
  db:
    data:
      POSTGRES_PASSWORD: "CHANGE_ME"
