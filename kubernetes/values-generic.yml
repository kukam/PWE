# Nasazeni vzoroveho webu S DATABAZI (webapps/example-db.web + MariaDB) do Kubernetes.
#
#   chart:   oci://registry.nixys.ru/nuc/nxs-universal-chart, verze 3.2.2
#   release: pwe-generic  ->  https://pwe-generic.<domena>
#   postup:  kubernetes/README.md  (make k8s-image K8S=generic; make k8s-deploy K8S=generic)
#
# Web: jeden pod = dva kontejnery, nginx (port 80) a engine (FastCGI na portu 7779, z jinych podu zavrenem). Statiku - static/
# a assets/ webu a assets/ enginu - zkopiruje pri startu initContainer z image webu do sdileneho svazku
# a nginx ji posila primo, stejne jako ve vyvojovem stacku (docker-compose/docker-compose_nginx.conf).
# Databaze: MariaDB jako StatefulSet s vlastnim svazkem (PVC), dostupna jen uvnitr clusteru na
# <release>-mariadb:3306. Schema si pri prvnim startu zalozi engine sam (migrace conf/mariadb.dbversion).
#
# Hesla databaze v tomto souboru NEJSOU: jsou v kubernetes/secrets-generic.yml (neni v gitu). Pri prvnim
# make k8s-deploy K8S=generic ho PWE/tools/k8s.sh zalozi ze secrets-generic.example.yml s nahodnymi hesly.
#
# Vlastni web s MariaDB: zkopiruj tento soubor jako values-<nazev>.yml (a secrets-generic.example.yml jako
# secrets-<nazev>.example.yml), uprav generic.pweWeb, generic.pweImage (a pripadne generic.pweHost),
# sestav image (make k8s-image K8S=<nazev>) a nasad ho (make k8s-deploy K8S=<nazev>, release pwe-<nazev>).
# Databaze je zde natvrdo MariaDB (blok statefulSets); pro PostgreSQL nebo MySQL je potreba blok
# statefulSets prepsat - viz kubernetes/README.md, Jina databaze nez MariaDB.

generic:
  # --- nastaveni PWE: cte je i PWE/tools/k8s.sh a pouzivaji je sablony niz ({{ .Values.generic.pwe... }}) ---
  pweWeb: example-db.web           # adresar webu ve webapps/ (image se stavi z webapps/<web>/Dockerfile)
  pweProfile: mariadb              # profil behoveho image (ovladac databaze); musi odpovidat databazi niz
  pweImage: pwe-example-generic    # nazev image webu (bez registru a tagu)
  pweHost: ""                      # cela adresa webu, napr. www.mujweb.cz; prazdne = <release>.<pweDomain>
  # --- nasledujici ctyri hodnoty prepisuje make k8s-deploy podle kubernetes/local.env (--set-string) ---
  pweRegistry: docker.io/kukam     # registr, ze ktereho image webu taha cluster   (K8S_PULL_REGISTRY)
  pweImageTag: master              # tag image webu, pripadne tag@sha256:<digest>    (K8S_IMAGE_TAG)
  pweDomain: example.com           # web pobezi na https://<release>.<pweDomain>     (K8S_DOMAIN)
  pweIssuer: letsencrypt           # ClusterIssuer cert-manageru pro certifikat      (K8S_ISSUER)
  # --- dalsi hodnoty make k8s-deploy sam neprepisuje: zmen je tady, nebo je predej pres K8S_HELM_ARGS
  #     (napr. --set-string generic.pweNginxImage=harbor.example.com/dockerhub/library/nginx) ---
  pweNginxImage: nginx             # image webserveru (bez tagu)
  pweNginxImageTag: stable
  pweTimezone: Europe/Prague       # casove pasmo kontejneru enginu a databaze (promenna TZ)
  pweDbImage: mariadb              # image databaze (bez tagu)
  pweDbImageTag: "11.8"
  pweDbName: pwe                   # nazev databaze a uzivatel, pod kterym se engine pripojuje; MariaDB
  pweDbUser: pwe                   # je zalozi jen pri prvnim startu nad prazdnym svazkem (pozdejsi zmena nic nezmeni)
  # ConfigMapy a Secrety jako bezne zdroje releasu (vychozi chovani chartu z nich dela helm hooky,
  # ktere helm uninstall nemaze).
  hookAnnotations: {}

configMaps:
  nginx-conf:
    data:
      default.conf: |
        # HTTPS konci na ingressu, do podu jde HTTP. Engine podle promenne HTTPS voli typ session
        # cookie a schema odkazu, proto se mu puvodni schema predava z hlavicky X-Forwarded-Proto.
        map $http_x_forwarded_proto $pwe_https {
            default "";
            https   on;
        }

        server {
            listen 80;
            server_tokens off;

            # nahravane soubory: stejny limit jako pwe.cgi_maxfilesize webu (100 MB)
            client_max_body_size 100m;

            # skutecna adresa klienta z hlavicky ingressu (engine ji cte z REMOTE_ADDR)
            set_real_ip_from 0.0.0.0/0;
            real_ip_header   X-Forwarded-For;

            # kontrola zivosti samotneho nginx (sondy podu)
            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            # Statika primo z disku: nejdrive static/, assets/ a uploadfile/ webu, pak assets/ enginu.
            location ~ ^/(assets|static|uploadfile)/ {
                root /srv/web;
                try_files $uri @engine_assets;
                expires 7d;
                access_log off;
            }

            location @engine_assets {
                root /srv/engine;
                expires 7d;
                access_log off;
            }

            location / {
                gzip off;
                fastcgi_pass 127.0.0.1:7779;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
                fastcgi_param HTTPS $pwe_https if_not_empty;
                # Casove pasmo pro requesty: FastCGI pri kazdem requestu nahradi prostredi enginu
                # parametry od nginx, takze promenna TZ kontejneru plati jen pri startu enginu.
                fastcgi_param TZ "{{ .Values.generic.pweTimezone }}";
                # Verze statiky pro odkazy typu site.css?v=... (sablony ji znaji jako start_time).
                # Meni se s kazdym novym image, takze prohlizec po nasazeni nacte nove soubory.
                fastcgi_param APACHE_START_TIME "{{ .Values.generic.pweImageTag | sha1sum | trunc 10 }}";
            }

            error_log  /dev/stderr warn;
            access_log /dev/stdout;
        }

deployments:
  web:
    replicas: 2
    extraSelectorLabels:
      app.kubernetes.io/component: web
    terminationGracePeriodSeconds: 20
    automountServiceAccountToken: false     # pody nepotrebuji pristup k API clusteru
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: static
        image: "{{ .Values.generic.pweRegistry }}/{{ .Values.generic.pweImage }}"
        imageTag: "{{ .Values.generic.pweImageTag }}"
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            web="/PWE/webapps/{{ .Values.generic.pweWeb }}"
            mkdir -p /srv/engine /srv/web/uploadfile
            cp -a /PWE/PWE/assets /srv/engine/
            for dir in static assets; do
                if [ -d "$web/$dir" ]; then cp -a "$web/$dir" /srv/web/; fi
            done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: static
            mountPath: /srv
    containers:
      - name: fcgi
        image: "{{ .Values.generic.pweRegistry }}/{{ .Values.generic.pweImage }}"
        imageTag: "{{ .Values.generic.pweImageTag }}"
        # Pred SIGTERM pocka 5 s: ingress mezitim vyradi pod z endpointu a rozpracovane pozadavky dobehnou.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
          - name: fcgi
            containerPort: 7779
        env:
          # FastCGI posloucha na vsech rozhranich podu (engine adresu host:port nepodporuje - nastavuje
          # socket_perm a CGI::Fast pak zkousi chmod). Z jinych podu je port 7779 zavreny pravidlem
          # networkPolicies.web niz.
          - name: FCGI_SOCKET_PATH
            value: ":7779"
          # TZ pro start enginu (pro requesty ho predava nginx, viz fastcgi_param TZ)
          - name: TZ
            value: "{{ .Values.generic.pweTimezone }}"
          - name: PWE_CONF_pwe_development
            value: "0"
          - name: PWE_CONF_http_base_url
            value: '{{ .Values.generic.pweHost | default (printf "%s.%s" .Release.Name .Values.generic.pweDomain) }}'
          - name: PWE_CONF_log_logout
            value: "STDERR"
          - name: PWE_CONF_log_loglevel
            value: "2"
          # pripojeni k databazi (prepisuje hodnoty z conf/mariadb.conf v image webu)
          - name: PWE_CONF_dbi_db1_host
            value: "{{ .Release.Name }}-mariadb"
          - name: PWE_CONF_dbi_db1_database
            value: "{{ .Values.generic.pweDbName }}"
          - name: PWE_CONF_dbi_db1_login
            value: "{{ .Values.generic.pweDbUser }}"
          # engine zkousi pripojeni po 1 s; pri prvnim nasazeni databaze teprve startuje
          - name: PWE_CONF_dbi_db1_trayconnect
            value: "60"
          # Trasovani DBI vypnute: conf webu muze mit loglevel 1 (kazde SQL vcetne vazanych hodnot -
          # e-maily, hashe hesel - do log/<ovladac> ve vrstve kontejneru, bez rotace).
          - name: PWE_CONF_dbi_db1_loglevel
            value: "0"
          - name: PWE_CONF_dbi_db1_logfile
            value: /dev/null
        envsFromSecret:
          db:
            - PWE_CONF_dbi_db1_password: MARIADB_PASSWORD
        # Sonda zkousi spojeni zevnitr kontejneru (nezavisi na sitovych pravidlech podu).
        # Socket otevre engine az po pripojeni k databazi a migracich (checkDbversion): do te doby hlida
        # jen startupProbe (az 10 min = K8S_TIMEOUT), takze liveness engine nezabije uprostred migrace.
        startupProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7779"]
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7779"]
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7779"]
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        # Engine bezi jako root (jako ve vyvojovem stacku), ale bez linuxovych opravneni:
        # zapisuje jen do adresaru sveho webu.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
          - name: uploadfile
            mountPath: "/PWE/webapps/{{ .Values.generic.pweWeb }}/uploadfile"
      - name: nginx
        image: "{{ .Values.generic.pweNginxImage }}"
        imageTag: "{{ .Values.generic.pweNginxImageTag }}"
        # Pred SIGTERM pocka 5 s: ingress mezitim vyradi pod z endpointu a rozpracovane pozadavky dobehnou.
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        ports:
          - name: http
            containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        # nginx potrebuje jen navazat port 80 a prepnout pracovni procesy na uzivatele nginx
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d
          - name: static
            mountPath: /srv
            readOnly: true
          - name: uploadfile
            mountPath: /srv/web/uploadfile
            readOnly: true
    volumes:
      - name: nginx-conf          # ConfigMap <release>-nginx-conf (viz configMaps)
        type: configMap
      - name: static              # kopie statiky z image webu (plni ji initContainer)
        type: emptyDir
      # Nahrane soubory jsou jen v tomto podu a zaniknou s nim. Pro skutecny web je nahrad svazkem
      # sdilenym mezi pody: type: pvc + polozka v pvcs s accessModes ReadWriteMany.
      - name: uploadfile
        type: emptyDir

statefulSets:
  mariadb:
    replicas: 1
    extraSelectorLabels:
      app.kubernetes.io/component: mariadb
    automountServiceAccountToken: false
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: mariadb
        image: "{{ .Values.generic.pweDbImage }}"
        imageTag: "{{ .Values.generic.pweDbImageTag }}"
        ports:
          - name: mysql
            containerPort: 3306
        env:
          - name: TZ
            value: "{{ .Values.generic.pweTimezone }}"
          - name: MARIADB_DATABASE
            value: "{{ .Values.generic.pweDbName }}"
          - name: MARIADB_USER
            value: "{{ .Values.generic.pweDbUser }}"
        envsFromSecret:
          db:
            - MARIADB_ROOT_PASSWORD
            - MARIADB_PASSWORD
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: data
            mountPath: /var/lib/mysql
    # Svazek databaze. Bez storageClassName se pouzije vychozi trida uloziste clusteru.
    # helm uninstall ho NEMAZE (data databaze prezivi odinstalovani i nove nasazeni).
    # volumeClaimTemplates nelze po prvnim nasazeni menit (API StatefulSetu zmenu odmitne a helm upgrade
    # selze). Zvetseni svazku: kubectl --context <kontext> -n pwe patch pvc data-<release>-mariadb-0
    # (trida uloziste musi mit allowVolumeExpansion), pak kubectl ... delete sts <release>-mariadb
    # --cascade=orphan a make k8s-deploy s novou velikosti. Povyseni hlavni verze pweDbImageTag
    # (napr. 11.8 -> 12) delej se zalohou; MariaDB ho provede sama jen s MARIADB_AUTO_UPGRADE=1.
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

services:
  web:
    extraSelectorLabels:
      app.kubernetes.io/component: web
    ports:
      - name: http
        port: 80
        targetPort: http

ingresses:
  web:
    ingressClassName: nginx
    annotations:
      # Stav navstevnika je v databazi (pwe.save_opt_to = db), ale nahrane soubory (uploadfile/) jsou
      # v tomto prikladu jen v podu, ktery je prijal - proto navstevnik zustava u stejneho podu.
      # Se sdilenym svazkem pro uploadfile/ (ReadWriteMany) lze tyto dve anotace vypustit.
      nginx.ingress.kubernetes.io/affinity: "cookie"
      nginx.ingress.kubernetes.io/session-cookie-name: "pwe-pod"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    certManager:
      originalIssuerName: "{{ .Values.generic.pweIssuer }}"
    hosts:
      - hostname: '{{ .Values.generic.pweHost | default (printf "%s.%s" .Release.Name .Values.generic.pweDomain) }}'
        paths:
          - path: /
            serviceName: web
            servicePort: http

# Sitova pravidla: do podu webu smi zvenku jen port 80 (nginx; ingress controller i ostatni pody).
# Port enginu 7779 je dostupny jen uvnitr podu (nginx -> 127.0.0.1) - jinak by jiny pod mohl obejit
# ingress i nginx a podvrhnout enginu adresu klienta nebo HTTPS. Pravidla musi podporovat sitovy plugin
# clusteru (Calico, Cilium ...); bez nej se tise ignoruji. Port 80 lze dal omezit jen na namespace
# ingress controlleru (from: namespaceSelector).
networkPolicies:
  web:
    podSelector:
      matchLabels:
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: web
    policyTypes: ["Ingress"]
    ingress:
      - ports:
          - port: 80
            protocol: TCP
  # Databaze prijima spojeni jen z podu webu tehoz releasu.
  mariadb:
    podSelector:
      matchLabels:
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: mariadb
    policyTypes: ["Ingress"]
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/instance: "{{ .Release.Name }}"
                app.kubernetes.io/component: web
        ports:
          - port: 3306
            protocol: TCP
