# Hesla databaze pro kubernetes/values-generic.yml (Secret <release>-db).
#
# Tento soubor je vzor. Skutecna hesla patri do kubernetes/secrets-generic.yml, ktery NENI v gitu:
# pri prvnim make k8s-deploy K8S=generic ho PWE/tools/k8s.sh zalozi z tohoto vzoru a kazde
# CHANGE_ME nahradi nahodnym heslem. Soubor si uschovej - MariaDB si hesla zapise do sveho svazku
# pri prvnim startu a pozdejsi zmena tady je v databazi sama nezmeni.
secrets:
  db:
    data:
      MARIADB_ROOT_PASSWORD: "CHANGE_ME"
      MARIADB_PASSWORD: "CHANGE_ME"
