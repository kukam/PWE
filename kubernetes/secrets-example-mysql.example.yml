# Hesla databaze pro kubernetes/values-example-mysql.yml (Secret <release>-db).
#
# Tento soubor je vzor. Skutecna hesla patri do kubernetes/secrets-example-mysql.yml, ktery NENI v gitu:
# pri prvnim make k8s-deploy K8S=example-mysql ho PWE/tools/k8s.sh zalozi z tohoto vzoru a kazde
# CHANGE_ME nahradi nahodnym heslem. Soubor si uschovej - MySQL si hesla zapise do sveho svazku
# pri prvnim startu a pozdejsi zmena tady je v databazi sama nezmeni.
secrets:
  db:
    data:
      MYSQL_ROOT_PASSWORD: "CHANGE_ME"
      MYSQL_PASSWORD: "CHANGE_ME"
