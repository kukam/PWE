server {

  listen 80;

  location /debug.cgi {
      gzip off;
      #fastcgi_keep_conn on;
      fastcgi_pass pwe_balancer_debug;
      fastcgi_param SCRIPT_FILENAME \$fastcgi_script_name;
      include fastcgi_params;
  }

  # Statika primo z disku: nejdrive static/ a assets/ webu (PWE_WEBAPP), pak assets/ enginu
  # (/PWE/PWE/assets = adresar PWE/assets v repozitari; nazev @core_assets znamena koren enginu).
  # Engine (systemPage) zustava jen jako zaloha pro nasazeni bez teto konfigurace.
  location ~ ^/(assets|static|uploadfile)/ {
      root /PWE/webapps/${PWE_WEBAPP};
      try_files \$uri @core_assets;
      expires 7d;
      access_log off;
  }

  location @core_assets {
      root /PWE/PWE;
      expires 7d;
      access_log off;
  }

  location / {
      gzip off;
      #fastcgi_keep_conn on;
      fastcgi_pass pwe_balancer;
      fastcgi_param SCRIPT_FILENAME \$fastcgi_script_name;
      include fastcgi_params;
  }

  error_log /dev/stdout info;
  access_log /dev/stdout;
#   error_log /dev/null info;
#   access_log /dev/null;

}

# Adresy kontejneru zjistuje nginx prubezne pres DNS Dockeru (parametr "resolve" + sdilena zona),
# ne jen jednou pri svem startu. Kdyz compose kontejnery fcgi nebo debugger vytvori znovu (make run
# po make images, zmena image), dostanou jine IP adresy - bez toho by nginx dal posilal requesty na
# stare adresy a /debug.cgi by mohlo skoncit u bezneho procesu fcgi misto u debuggeru.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream pwe_balancer {
    zone pwe_balancer 64k;

    # http://nginx.org/en/docs/http/load_balancing.html
    #ip_hash;
    
    #Docker swarm/kubernetes balancer (pwe is alias container name in swarm/kubernetes)
    server pwe-fcgi-1:7779 max_fails=0 resolve;
    server pwe-fcgi-2:7779 max_fails=0 resolve;
    server pwe-fcgi-3:7779 max_fails=0 resolve;

    # Clasic
    #server 192.168.1.1:7779;
    #server 192.168.1.2:7779;
    #server 192.168.1.3:7779;
  
    # UNIX Socker
    #server unix:/PWEROOT/pwe.sock;
}

# upstream pwe_balancer_debug {
#     server ${MY_IP}:7779 max_fails=0;
# }

upstream pwe_balancer_debug {
    zone pwe_balancer_debug 64k;
    server pwe-debugger-1:7779 resolve;
}