<h1 class="border-bottom pb-2 mb-4">[% rb.h1 %]</h1>

<div class="accordion" id="accordion">
    <div class="accordion-item">
        <h2 class="accordion-header" id="headingOne">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">[% rb.h2_createpage %]</button>
        </h2>
        <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#accordion">
            <div class="accordion-body">
                <script>$(function() { AjaxFormAppender($("#createpage")); });</script>
                [% INCLUDE "Pages/pweCreator/pageForm.html" formid="createpage" %]
            </div>
        </div>
    </div>
    <div class="accordion-item">
        <h2 class="accordion-header" id="headingTwo">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">[% rb.h2_createservice %]</button>
        </h2>
        <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordion">
            <div class="accordion-body">
                <script>$(function() { AjaxFormAppender($("#createservice")); });</script>
                [% INCLUDE "Pages/pweCreator/serviceForm.html" formid="createservice" %]
            </div>
        </div>
    </div>
    <div class="accordion-item">
        <h2 class="accordion-header" id="headingThree">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">[% rb.h2_createsite %]</button>
        </h2>
        <div id="collapseThree" class="accordion-collapse collapse" aria-labelledby="headingThree" data-bs-parent="#accordion">
            <div class="accordion-body">
                <script>$(function() { AjaxFormAppender($("#createsite")); });</script>
                [% INCLUDE "Pages/pweCreator/siteForm.html" formid="createsite" %]
            </div>
        </div>
    </div>
    <div class="accordion-item">
        <h2 class="accordion-header" id="headingFour">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseFour" aria-expanded="false" aria-controls="collapseFour">[% rb.h2_createentity %]</button>
        </h2>
        <div id="collapseFour" class="accordion-collapse collapse" aria-labelledby="headingFour" data-bs-parent="#accordion">
            <div class="accordion-body">
                <script>$(function() { AjaxFormAppender($("#createentity")); });</script>
                [% INCLUDE "Pages/pweCreator/entityForm.html" formid="createentity" %]
            </div>
        </div>
    </div>
</div>
